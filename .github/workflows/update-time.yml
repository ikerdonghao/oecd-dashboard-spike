name: update-time

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "13 13 * * *"

permissions:
  contents: write

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write current time
        run: date -u "+%Y-%m-%d %H:%M UTC" > updated_at.txt
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updated_at.txt
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "chore: robot updated the timestamp"
            git push
          fi
